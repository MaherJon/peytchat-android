name: CI

on:
  push:
    branches: - '**'
  pull_request:
    branches: - '**'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: 20

jobs:
  # 1. 前端检查
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npx tsc --noEmit
      
      - name: Lint
        run: npm run lint 2>/dev/null || echo "No lint script"
      
      - name: Build frontend
        run: npm run build

  # 2. Rust 检查 (桌面)
  rust-check-desktop:
    name: Rust Check (Desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: clippy, rustfmt
      
      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      
      - name: Check formatting
        run: cd src-tauri && cargo fmt -- --check
      
      - name: Clippy
        run: cd src-tauri && cargo clippy -- -D warnings
      
      - name: Build (desktop)
        run: cd src-tauri && cargo build --release

  # 3. Android 检查
  android-check:
    name: Android Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build frontend
        run: npm run build
      
      - name: Check Android build
        run: |
          cd src-tauri
          cargo check --target aarch64-linux-android
      
      - name: Build Android APK
        run: |
          npm run tauri android build 2>/dev/null || \
          cd src-tauri/gen/android && ./gradlew assembleDebug

  # 4. 测试
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [frontend-check, rust-check-desktop]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      
      - name: Run Rust tests
        run: cd src-tauri && cargo test
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run frontend tests
        run: npm test 2>/dev/null || echo "No tests"