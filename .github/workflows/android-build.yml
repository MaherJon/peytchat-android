name: Android Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build frontend
        run: npm run build

      - name: Init android project
        run: |
          npx tauri android init || true
          if [ -f ./configfile/android/tauri.build.gradle.kts ]; then
            cp ./configfile/android/tauri.build.gradle.kts ./src-tauri/gen/android
          else
            echo "⚠️  config file not found, skipping"
          fi
          if [ -f ./configfile/android/tauri.settings.gradle ]; then
            cp ./configfile/android/tauri.settings.gradle ./src-tauri/gen/android
          else
            echo "⚠️  config file not found, skipping"
          fi
      
      - name: Build Android
        id: build
        run: |
          if [ "${{ inputs.release_type }}" = "release" ] || [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            npm run tauri android build
            APK_PATH="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          else
            npm run tauri android dev
            APK_PATH="src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK built: $APK_PATH"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: peytchat-android-${{ github.sha }}
          path: ${{ steps.build.outputs.apk_path }}
          retention-days: 30

  test:
    name: Test APK
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: peytchat-android-${{ github.sha }}
      
      - name: Verify APK
        run: |
          APK=$(find . -name "*.apk" | head -1)
          echo "APK: $APK"
          file "$APK"
          unzip -l "$APK" | head -20