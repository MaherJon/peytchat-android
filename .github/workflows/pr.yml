name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # 1. 检查 PR 标题 - 宽松版本
      - name: Check PR title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $TITLE"
          
          # 宽松检查：只要不以 "fix:" 或 "feat:" 开头就警告，但不阻止
          if echo "$TITLE" | grep -qE "^(feat|fix|docs|style|refactor|test|chore|ci|perf|build|revert)(\(.+\))?: .+"; then
            echo "✅ PR title follows Conventional Commits"
          else
            echo "⚠️ PR title does not follow Conventional Commits format"
            echo "   Format: <type>(<scope>): <description>"
            echo "   Example: feat(android): add bottom navigation"
            echo "   This is a warning, not blocking the merge"
            # 不退出，只是警告
          fi
      
      # 2. 检查分支名称 - 警告但不阻止
      - name: Check branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Branch: $BRANCH"
          
          if [[ ! "$BRANCH" =~ ^(feat|fix|docs|chore|refactor|test|ci|perf|build|revert)/.+ ]]; then
            echo "⚠️ Branch name should follow: <type>/<description>"
            echo "   Example: feat/android-ux"
            echo "   This is a warning, not blocking"
          fi
      
      # 3. 检查文件变更 - 只警告
      - name: Check file changes
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null || echo "")
          echo "Changed files: $CHANGED_FILES"
          
          # 检查是否修改了 core
          if echo "$CHANGED_FILES" | grep -q "^core/"; then
            echo "⚠️ core/ directory was modified"
            echo "   This is a warning, not blocking"
          fi
      
      # 4. 检查 PR 大小 - 警告
      - name: Check PR size
        run: |
          CHANGES=$(git diff --shortstat origin/main...HEAD 2>/dev/null || echo "")
          echo "Changes: $CHANGES"
          
          ADDED=$(echo "$CHANGES" | grep -oP '\d+(?= insertions)' || echo 0)
          DELETED=$(echo "$CHANGES" | grep -oP '\d+(?= deletions)' || echo 0)
          TOTAL=$((ADDED + DELETED))
          
          if [ $TOTAL -gt 5000 ]; then
            echo "⚠️ Large PR ($TOTAL lines)"
            echo "   Consider splitting into smaller PRs"
            echo "   This is a warning, not blocking"
          fi
      
      # 5. 始终通过
      - name: Validation complete
        run: |
          echo "✅ PR validation complete"
          echo "⚠️ Warnings are informational only"
          exit 0